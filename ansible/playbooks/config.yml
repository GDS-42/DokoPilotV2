# Validates a client configuration and prints the effective settings (no change on the server).
- name: Show the effective configuration
  hosts: dokopilot
  gather_facts: false
  roles:
    - role: config
  tasks:
    - name: Print the effective configuration
      ansible.builtin.debug:
        var: dp
