# Configures the agent harness (opencode, Claude Code) on the entrepreneur's computer.
# Run it on that computer with `bin/dokopilot harness <client> [--dest DIR]`.
#
# Play 1 reads, on the server and with sudo, the token of the entrepreneur's assistant user
# (and the MagicDNS name in tailscale mode). Play 2 renders the workspace on this computer.
# Tests and automation can skip play 1 by passing harness_assistant_credentials (and, in
# tailscale mode, harness_tailscale_dns_name) in a vars file: see ansible/roles/harness.

- name: Read the assistant credentials on the server
  hosts: dokopilot
  gather_facts: false
  roles:
    - role: config
  tasks:
    - name: Read the token of the assistant user and the name of the server
      ansible.builtin.include_role:
        name: harness
        tasks_from: server.yml
      when: harness_assistant_credentials is not defined

- name: Configure the harness on this computer
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: config
    - role: harness
