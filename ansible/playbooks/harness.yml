# Configures the agent harness (opencode, Claude Code) on the computer of one person, inside
# the person's clone of the company's context repository (docs/plan-v0.2.md C-4).
# Run it on that computer with `bin/dokopilot harness <client> [--person <id>] [--dest DIR]`.
#
# Play 1 reads on the server, with sudo, the person's Forgejo credentials, the Dokos
# credentials of the assistant (dirigeant only, decision D-29), the address of Forgejo and,
# in tailscale mode, the MagicDNS name. Play 2 clones or updates the context repositories
# and renders the harness on this computer. Tests and automation can inject the server reads
# in a vars file (see ansible/roles/harness/defaults/main.yml).

- name: Read the credentials of the person on the server
  hosts: dokopilot
  gather_facts: false
  roles:
    - role: config
  tasks:
    - name: Read the person's credentials and the addresses of Forgejo and Dokos
      ansible.builtin.include_role:
        name: harness
        tasks_from: server.yml

- name: Configure the harness on this computer
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: config
    - role: harness
