# SPDX-License-Identifier: AGPL-3.0-or-later
# Full installation or update of one client server. Run it with `bin/dokopilot install <client>`.
- name: System hardening, maintenance access, firewall, Tailscale, Docker
  ansible.builtin.import_playbook: system.yml

- name: Dokos stack, site, configuration, demo data, backups
  ansible.builtin.import_playbook: dokos.yml

- name: Forgejo and the preinstalled context
  ansible.builtin.import_playbook: context.yml

- name: Access to Dokos and Forgejo, and summary
  hosts: dokopilot
  become: true
  roles:
    - role: config
    - role: proxy
  tasks:
    - name: Print the summary for the integrator
      ansible.builtin.debug:
        msg:
          - "Installation terminée pour {{ dp.client.company_name }} (profil {{ dp.profile }})."
          - "Dokos : {{ dokopilot_dokos_url | default('voir le rôle proxy') }}"
          - "Contexte (Forgejo) : {{ dokopilot_forgejo_url | default('non installé (context.enabled: false)') }}"
          - "Entrepreneur : {{ dp.users.entrepreneur.email }} — mot de passe initial : bin/dokopilot secrets {{ dp.client.id }} show entrepreneur_password"
          - "Administrateur : Administrator — bin/dokopilot secrets {{ dp.client.id }} show dokos_admin_password"
          - "Assistant dans Dokos : {{ dp.users.assistants | map(attribute='email') | join(', ') }} (jeton sur le serveur, récupéré par bin/dokopilot harness)"
          - >-
            Personnes : {{ dp.users.people | map(attribute='id') | join(', ') }} — comptes Forgejo et contextes perso ;
            poste de chacune : bin/dokopilot harness {{ dp.client.id }} --person <id>
          - "Contrôles : bin/dokopilot check {{ dp.client.id }} — poste de l'entrepreneur : bin/dokopilot harness {{ dp.client.id }}"
