# Hardened host: base system, maintenance accounts, SSH and fail2ban, firewall, Tailscale,
# Docker. Run with a maintenance account (after bootstrap.yml). The proxy role is applied
# by site.yml once Dokos is up.
- name: Prepare the DokoPilot host
  hosts: dokopilot
  become: true
  # A later role may stop the play (Tailscale waiting for an approval, a package mirror down):
  # the reloads of sshd, nftables and fail2ban already notified still run. Without this, the
  # files said « hardened » while the running services kept their previous settings, and the
  # next run, finding the files unchanged, never reloaded them.
  force_handlers: true
  roles:
    - role: config
    - role: base
    - role: maintenance
    - role: ssh
    - role: fail2ban
    - role: firewall
    - role: tailscale
      when: dp.network.mode == 'tailscale'
    - role: docker
