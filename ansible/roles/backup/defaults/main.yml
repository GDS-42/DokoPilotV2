# SPDX-License-Identifier: AGPL-3.0-or-later
# Encrypted backups with restic (Debian package): `bench backup --with-files` of the site,
# plus the stack configuration (without its .env), to dp.backup.repository.

# --- Shared with the dokos, dokos_config and demo_data roles (same defaults everywhere)
dokopilot_stack_dir: /opt/dokopilot/stack
dokopilot_compose_project: dokopilot
dokopilot_etc_dir: /etc/dokopilot
dokopilot_bench_backup_dir: /var/lib/dokopilot/bench-backups
# Forgejo (context repositories), saved when dp.context.enabled: same defaults as the forgejo role.
dokopilot_forgejo_dir: /opt/dokopilot/forgejo
# Working directory of the copy of the Forgejo data volume (removed after each backup).
dokopilot_forgejo_backup_dir: /var/lib/dokopilot/forgejo-backups

# restic settings (RESTIC_REPOSITORY, RESTIC_PASSWORD, secrets.restic_env), root only.
backup_env_file: "{{ dokopilot_etc_dir }}/restic.env"
# Identifier of this installation, created by the first backup: its snapshots carry the tag
# install:<id>, so that another server on the same repository never prunes them.
backup_install_id_file: "{{ dokopilot_etc_dir }}/install-id"
# Date of the last complete backup, written by the backup script and read by check.yml
# (playbooks/tasks/host-checks.yml uses the same default path).
backup_stamp_file: "{{ dokopilot_bench_backup_dir | dirname }}/last-backup"
# One backup or restore at a time.
backup_lock_file: /run/lock/dokopilot-backup.lock
backup_script: /usr/local/sbin/dokopilot-backup
restore_script: /usr/local/sbin/dokopilot-restore
backup_unit_name: dokopilot-backup
backup_systemd_dir: /etc/systemd/system
backup_packages:
  - restic
  - python3
# Systemd timer for the daily backup (dp.backup.schedule). Only a host without systemd
# (the test container) sets this to false; the unit files are written anyway.
backup_enable_timer: true
# Seconds the timer may delay the start, so that several servers do not hit the same
# repository at once.
backup_randomized_delay: 900
# A backup that has not ended after this long is stopped (a hung upload would otherwise hold
# the lock, and every later run would be refused).
backup_timeout: 6h
# `check` fails when the last successful backup is older than this many hours (a daily
# schedule plus its delay and a margin).
backup_max_age_hours: 36
