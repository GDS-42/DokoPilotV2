- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  # Restart only a running resolver: never start one the image left stopped.
  when: (_base_resolved_unit.status.ActiveState | default('')) == 'active'
