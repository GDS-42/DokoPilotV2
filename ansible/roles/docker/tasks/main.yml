# Docker CE and its daemon settings. Nobody is added to the docker group.

- name: Remove the packages that conflict with Docker CE
  ansible.builtin.apt:
    name: "{{ docker_conflicting_packages }}"
    state: absent

- name: Install the module needed to manage deb822 repository files
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: "{{ docker_keyring | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Docker repository signing key
  ansible.builtin.copy:
    src: "{{ docker_keyring_src }}"
    dest: "{{ docker_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Add the Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: ["{{ docker_apt_uri }}"]
    suites: ["{{ docker_apt_suite }}"]
    components: "{{ docker_apt_components }}"
    architectures: ["{{ docker_deb_arch }}"]
    signed_by: "{{ docker_keyring }}"
    state: present

- name: Install Docker CE
  ansible.builtin.apt:
    name: "{{ docker_packages + docker_extra_packages }}"
    state: present
    install_recommends: false
    update_cache: true

- name: Create the Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure the Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json(indent=2) }}\n"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/dockerd --validate --config-file %s
  notify: Restart docker

- name: Keep Docker enabled and running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - containerd
    - docker

# Containers created later in the play (Dokos roles) must get the logging settings above.
- name: Apply the new daemon settings before any container is created
  ansible.builtin.meta: flush_handlers
