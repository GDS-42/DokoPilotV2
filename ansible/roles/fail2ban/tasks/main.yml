# fail2ban jail for SSH, reading the systemd journal (Debian 13 has no auth.log by default).

- name: Install fail2ban
  ansible.builtin.apt:
    name:
      - fail2ban
      - python3-systemd
    state: present
    install_recommends: false

- name: Configure the SSH jail
  ansible.builtin.template:
    src: jail.local.j2
    dest: "{{ fail2ban_jail_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload fail2ban

- name: Check the fail2ban configuration
  ansible.builtin.command: fail2ban-client --test
  changed_when: false
  check_mode: false

- name: Keep fail2ban enabled and running
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
