# Runs on the entrepreneur's computer (play 2 of harness.yml): stores the credentials in
# ~/.config/dokopilot/<client> (0700), then renders the workspace for the enabled harnesses.

- name: Check the workstation settings
  ansible.builtin.assert:
    quiet: true
    that:
      - harness_home is match('^/')
      - harness_dest is match('^/')
      - not (harness_dest ~ '/').startswith(harness_config_root ~ '/')
      - dp.harness.enabled | length > 0
      - dp.harness.default in dp.harness.enabled
      - (dp.harness.opencode_version | default(harness_opencode_version) | int) in [1, 2]
      - not dp.harness.mail.enabled or (dp.harness.mail.imap_host | length > 0 and dp.harness.mail.username | length > 0)
      - not dp.harness.calendar.enabled or (dp.harness.calendar.caldav_url is match('^https://') and dp.harness.calendar.username | length > 0)
    fail_msg: >-
      Réglages du poste invalides : harness.enabled doit contenir harness.default
      ({{ dp.harness.default }}), le dossier de travail doit être un chemin absolu hors de
      ~/.config/dokopilot, harness.opencode_version vaut 1 ou 2, la messagerie demande
      harness.mail.imap_host et harness.mail.username, l'agenda une adresse
      harness.calendar.caldav_url en https:// et harness.calendar.username.

- name: Choose the credentials of the assistant user
  ansible.builtin.set_fact:
    _harness_credentials: >-
      {{ harness_assistant_credentials if harness_assistant_credentials is defined
         else hostvars[groups['dokopilot'][0]]['_harness_server_credentials'] }}
  no_log: true

- name: Check the credentials of the assistant user
  ansible.builtin.assert:
    quiet: true
    that:
      - _harness_credentials is mapping
      - _harness_credentials.api_key | default('') is match('^[A-Za-z0-9]{8,}$')
      - _harness_credentials.api_secret | default('') is match('^[A-Za-z0-9]{8,}$')
    fail_msg: >-
      Le fichier d'identifiants de l'assistant lu sur le serveur est incomplet : relancez
      « bin/dokopilot install {{ dp.client.id }} », qui le crée.
  no_log: true

- name: Work out the address of Dokos on the local network
  ansible.builtin.set_fact:
    _harness_dokos_host: "{{ dp.server.address }}"
    _harness_dokos_url: "http://{{ dp.server.address }}"
  when: dp.network.mode == 'lan'

- name: Work out the address of Dokos on the Tailscale network
  vars:
    _dns_name: >-
      {{ (harness_tailscale_dns_name if harness_tailscale_dns_name is defined
          else hostvars[groups['dokopilot'][0]]['_harness_server_dns_name'] | default(''))
         | trim | regex_replace('\.$', '') }}
  ansible.builtin.set_fact:
    _harness_dokos_host: "{{ _dns_name }}"
    _harness_dokos_url: "{{ ('https://' if dp.network.tailscale.https else 'http://') ~ _dns_name }}"
  when: dp.network.mode == 'tailscale'

- name: Check the address of Dokos
  ansible.builtin.assert:
    quiet: true
    that:
      - _harness_dokos_host is match('^[A-Za-z0-9.:-]+$')
    fail_msg: >-
      Adresse de Dokos introuvable : en mode lan, renseignez server.address ; en mode
      tailscale, vérifiez que le serveur est connecté (tailscale status) et que MagicDNS
      est activé dans la console Tailscale.

- name: Create the private DokoPilot folders on this computer
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ harness_config_root }}"
    - "{{ harness_config_dir }}"
    - "{{ harness_taint_dir }}"
    - "{{ harness_staging_dir }}"

- name: Store the Dokos token of the assistant user on this computer
  ansible.builtin.copy:
    content: "{{ _harness_credentials.api_key }}:{{ _harness_credentials.api_secret }}"
    dest: "{{ harness_token_file }}"
    mode: "0600"
  no_log: true

- name: Set up the mail connector
  ansible.builtin.include_tasks: mail.yml
  when: dp.harness.mail.enabled | bool

- name: Set up the calendar connector
  ansible.builtin.include_tasks: calendar.yml
  when: dp.harness.calendar.enabled | bool

- name: Build the permissions, the MCP servers and the guard policies
  ansible.builtin.include_tasks: policy.yml

- name: Render and install the workspace files
  ansible.builtin.include_tasks: workspace.yml

- name: Tell the entrepreneur what to do next
  vars:
    _harness_commands:
      opencode: "opencode (Tab pour passer du Bureau à l'Atelier)"
      claude-code: "claude (Bureau) ou claude --agent atelier (Atelier)"
  ansible.builtin.debug:
    msg:
      - "Poste configuré pour {{ dp.client.company_name }} : dossier de travail {{ harness_dest }}."
      - "Harnais par défaut : {{ dp.harness.default }} ; harnais configurés : {{ dp.harness.enabled | join(', ') }}."
      - "Pour commencer : ouvrez un terminal dans {{ harness_dest }} et lancez {{ _harness_commands[dp.harness.default] }}."
      - "Dokos : {{ _harness_dokos_url }} — l'agent agit sous l'identité de l'assistant, qui prépare des brouillons sans jamais valider."
      - "Jeton et mots de passe : {{ harness_config_dir }} (privé, jamais dans le dossier de travail)."
      - >-
        {{ 'Fichiers modifiés sur ce poste, remplacés et conservés en .bak : ' ~ (_harness_backups | join(', '))
           if _harness_backups | length > 0 else 'Aucun fichier modifié sur ce poste n’a été remplacé.' }}
      - "Garde-fous et risques résiduels : docs/poste-entrepreneur.md."
