# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds, as data, everything that carries a security decision: the opencode rules, the
# Claude Code settings, the MCP servers, the models and the policies read by the two guards.
# The templates only serialise these facts, so the decisions live in one place.

- name: Keep the opencode version, the MCP servers of this person and the agent's identity
  ansible.builtin.set_fact:
    _harness_oc_version: "{{ dp.harness.opencode_version | default(harness_opencode_version) | int }}"
    _harness_mcp_url: "{{ (_harness_dokos_url ~ harness_dokos_mcp_path) if _harness_dokos_user | bool else '' }}"
    _harness_dokos_prefix: "{{ harness_dokos_server ~ '_' }}"
    _harness_mail_prefix: "{{ harness_mail_server ~ '_' }}"
    _harness_calendar_prefix: "{{ harness_calendar_server ~ '_' }}"
    _harness_mcp_names: >-
      {{ ([harness_dokos_server] if _harness_dokos_user | bool else [])
         + ([harness_mail_server] if _harness_mail | bool else [])
         + ([harness_calendar_server] if _harness_calendar | bool else []) }}
    # opencode reads the key with {file:...} when it loads its configuration.
    _harness_model_key_ref: "{{ '{file:' ~ harness_model_key_file ~ '}' }}"

- name: Build the opencode rules that close every rule list
  ansible.builtin.set_fact:
    _harness_oc_guard_rules: >-
      {{ harness_oc_protect_rules
         + (harness_dokos_denied_tools | dokopilot_rules('deny', prefix=_harness_dokos_prefix))
         + (harness_mail_denied_tools | dokopilot_rules('deny', prefix=_harness_mail_prefix))
         + (harness_calendar_denied_tools | dokopilot_rules('deny', prefix=_harness_calendar_prefix)) }}

- name: Build the opencode rules of the workspace and of the two agents
  ansible.builtin.set_fact:
    _harness_oc_global_rules: >-
      {{ harness_oc_base_rules
         + harness_oc_context_rules
         + ((['*'] | dokopilot_rules('ask', prefix=_harness_dokos_prefix))
            + (harness_dokos_read_tools | dokopilot_rules('allow', prefix=_harness_dokos_prefix))
            + (harness_dokos_draft_tools | dokopilot_rules('ask', prefix=_harness_dokos_prefix))
            if _harness_dokos_user | bool else [])
         + ((['*'] | dokopilot_rules('ask', prefix=_harness_mail_prefix))
            + (harness_mail_read_tools | dokopilot_rules('allow', prefix=_harness_mail_prefix))
            + (harness_mail_draft_tools | dokopilot_rules('ask', prefix=_harness_mail_prefix))
            if _harness_mail | bool else [])
         + ((['*'] | dokopilot_rules('ask', prefix=_harness_calendar_prefix))
            + (harness_calendar_read_tools | dokopilot_rules('allow', prefix=_harness_calendar_prefix))
            + (harness_calendar_write_tools | dokopilot_rules('ask', prefix=_harness_calendar_prefix))
            if _harness_calendar | bool else [])
         + _harness_oc_guard_rules }}
    _harness_oc_bureau_rules: "{{ _harness_oc_guard_rules }}"
    _harness_oc_atelier_rules: "{{ harness_oc_atelier_rules + _harness_oc_guard_rules }}"

- name: Describe the environment of the calendar connector (no password here)
  ansible.builtin.set_fact:
    _harness_calendar_env: >-
      {{ {'CALDAV_URL': dp.harness.calendar.caldav_url,
          'CALDAV_USERNAME': dp.harness.calendar.username,
          'CALDAV_TIMEZONE': dp.client.timezone,
          'CALDAV_USER_EMAIL': dp.harness.calendar.email | default(dp.users.entrepreneur.email, true),
          'CALDAV_READ_ONLY': 'false',
          'CALDAV_DENY_TOOLS': harness_calendar_denied_tools | join(',')}
         | combine({'CALDAV_CALENDARS': dp.harness.calendar.calendars | default([]) | join(',')}
                   if dp.harness.calendar.calendars | default([]) | length > 0 else {}) }}

- name: Build the opencode configuration
  vars:
    # Secrets are referenced with {file:...}: opencode reads them when it loads its
    # configuration and passes them to the MCP connection, the process or the provider only.
    _base:
      dokos:
        type: remote
        url: "{{ _harness_mcp_url }}"
        oauth: false
        headers:
          Authorization: "{{ 'token {file:' ~ harness_token_file ~ '}' }}"
      mail:
        type: local
        command: "{{ [harness_mail_mcp_command, harness_mail_mcp_package, 'stdio'] }}"
        environment:
          MCP_EMAIL_SERVER_CONFIG_PATH: "{{ harness_mail_config_file }}"
      calendar:
        type: local
        command: "{{ [harness_calendar_mcp_command, '-y', harness_calendar_mcp_package] }}"
        environment: "{{ _harness_calendar_env | combine({'CALDAV_PASSWORD': '{file:' ~ harness_calendar_password_file ~ '}'}) }}"
    _names: "{{ _harness_mcp_names }}"
    # V2: tools exposed directly (no Code Mode), so that each one has its own rule.
    _servers_v2: "{{ dict(_names | zip(_names | map('extract', _base) | map('combine', {'codemode': false}))) }}"
    # V1: no Code Mode, and `enabled` instead of `disabled`.
    _servers_v1: "{{ dict(_names | zip(_names | map('extract', _base) | map('combine', {'enabled': true}))) }}"
    _key: "{{ _harness_model_key_opencode | bool }}"
    # Models (D-23): `model` is the Bureau's (the default agent), each agent names its own in
    # its frontmatter. V1 `small_model` (titles, summaries) is, in OpenCode 2, the model of
    # the hidden `title` agent (opencode's own migration of small_model).
    _models_v2: >-
      {{ ({'model': dp.models.bureau} if dp.models.bureau | length > 0 else {})
         | combine({'providers': {_harness_model_provider: {'settings': {'apiKey': _harness_model_key_ref}}}} if _key else {}) }}
    _models_v1: >-
      {{ ({'model': dp.models.bureau} if dp.models.bureau | length > 0 else {})
         | combine({'small_model': dp.models.small} if dp.models.small | length > 0 else {})
         | combine({'provider': {_harness_model_provider: {'options': {'apiKey': _harness_model_key_ref}}}} if _key else {}) }}
    _agents_v2: >-
      {{ dict(harness_oc_disabled_agents | product([{'disabled': true}]))
         | combine({'title': {'model': dp.models.small}} if dp.models.small | length > 0 else {}) }}
  ansible.builtin.set_fact:
    _harness_opencode_config: >-
      {{ {'$schema': 'https://opencode.ai/config.json',
          'default_agent': 'bureau',
          'share': 'disabled',
          'mcp': {'servers': _servers_v2},
          'permissions': _harness_oc_global_rules,
          'agents': _agents_v2} | combine(_models_v2)
         if _harness_oc_version == 2 else
         {'$schema': 'https://opencode.ai/config.json',
          'default_agent': 'bureau',
          'share': 'disabled',
          'mcp': _servers_v1,
          'permission': _harness_oc_global_rules | dokopilot_opencode_v1,
          'agent': dict(harness_oc_disabled_agents | product([{'disable': true}]))} | combine(_models_v1) }}

- name: Build the policy of the opencode guard plugin
  ansible.builtin.set_fact:
    _harness_oc_guard_policy:
      mail_prefix: "{{ _harness_mail_prefix }}"
      mail_server: "{{ harness_mail_server }}"
      safe_actions: >-
        {{ harness_oc_safe_actions
           + (harness_dokos_read_tools | map('regex_replace', '^', _harness_dokos_prefix) | list)
           + (harness_mail_read_tools | map('regex_replace', '^', _harness_mail_prefix) | list)
           + (harness_calendar_read_tools | map('regex_replace', '^', _harness_calendar_prefix) | list) }}
      always_ask: >-
        {{ (harness_dokos_draft_tools | map('regex_replace', '^', _harness_dokos_prefix) | list)
           + (harness_mail_draft_tools | map('regex_replace', '^', _harness_mail_prefix) | list)
           + (harness_calendar_write_tools | map('regex_replace', '^', _harness_calendar_prefix) | list) }}
      v1_blocked_when_exposed: "{{ harness_oc_v1_blocked_tools }}"
      # Author and committer of the commits made by the agent's shell (decision D-22).
      git_identity: "{{ _harness_assistant_identity }}"

- name: Build the MCP servers of Claude Code
  vars:
    _hooks_dir: "{{ harness_dest }}/.claude/hooks"
    _servers:
      dokos:
        type: http
        url: "{{ _harness_mcp_url }}"
        # Runs outside the Bash sandbox, at connection time, after the workspace is trusted:
        # the token is read from its private file and never enters any environment.
        headersHelper: "python3 {{ (_hooks_dir ~ '/dokos_headers.py') | quote }} {{ harness_token_file | quote }}"
      mail:
        type: stdio
        command: "{{ harness_mail_mcp_command }}"
        args: "{{ [harness_mail_mcp_package, 'stdio'] }}"
        env:
          MCP_EMAIL_SERVER_CONFIG_PATH: "{{ harness_mail_config_file }}"
      calendar:
        type: stdio
        command: python3
        args: >-
          {{ [_hooks_dir ~ '/caldav_launcher.py', harness_calendar_password_file,
              harness_calendar_mcp_command, '-y', harness_calendar_mcp_package] }}
        env: "{{ _harness_calendar_env }}"
  ansible.builtin.set_fact:
    _harness_claude_mcp:
      mcpServers: "{{ dict(_harness_mcp_names | zip(_harness_mcp_names | map('extract', _servers))) }}"

- name: Build the settings and the guard policy of Claude Code
  vars:
    _hooks_dir: "{{ harness_dest }}/.claude/hooks"
    _dokos: "mcp__{{ harness_dokos_server }}__"
    _mail: "mcp__{{ harness_mail_server }}__"
    _cal: "mcp__{{ harness_calendar_server }}__"
    _guard_hook:
      type: command
      command: python3
      args:
        - "{{ _hooks_dir }}/mail_taint_guard.py"
        - --state-dir
        - "{{ harness_taint_dir }}"
        - --policy
        - "{{ _hooks_dir }}/guard-policy.json"
      timeout: 30
      onFailure: block
    # The agent's commits carry the assistant's name (decision D-22): Claude Code applies
    # `env` to its session, so the Bash tool's git sees it. No secret here.
    _env:
      GIT_AUTHOR_NAME: "{{ _harness_assistant_identity.name }}"
      GIT_AUTHOR_EMAIL: "{{ _harness_assistant_identity.email }}"
      GIT_COMMITTER_NAME: "{{ _harness_assistant_identity.name }}"
      GIT_COMMITTER_EMAIL: "{{ _harness_assistant_identity.email }}"
    # models.claude_code_auth: api_key. Claude Code runs the helper itself, outside the Bash
    # sandbox, once the workspace is trusted; subscription: nothing to set, /login.
    _api_key_helper: >-
      {{ {'apiKeyHelper': 'python3 ' ~ ((_hooks_dir ~ '/model_key_helper.py') | quote) ~ ' ' ~ (harness_model_key_file | quote)}
         if _harness_model_key_claude | bool else {} }}
  ansible.builtin.set_fact:
    _harness_claude_settings: >-
      {{ {'$schema': 'https://json.schemastore.org/claude-code-settings.json'}
         | combine(_api_key_helper)
         | combine({
           'agent': 'bureau',
           'env': _env,
           'permissions': {
             'defaultMode': 'default',
             'disableBypassPermissionsMode': 'disable',
             'allow': ((harness_dokos_read_tools | map('regex_replace', '^', _dokos) | list) if _harness_dokos_user | bool else [])
                      + ((harness_mail_read_tools | map('regex_replace', '^', _mail) | list) if _harness_mail | bool else [])
                      + ((harness_calendar_read_tools | map('regex_replace', '^', _cal) | list) if _harness_calendar | bool else [])
                      + harness_claude_context_allow,
             'ask': ((harness_dokos_draft_tools | map('regex_replace', '^', _dokos) | list) if _harness_dokos_user | bool else [])
                    + ((harness_mail_draft_tools | map('regex_replace', '^', _mail) | list) if _harness_mail | bool else [])
                    + ((harness_calendar_write_tools | map('regex_replace', '^', _cal) | list) if _harness_calendar | bool else [])
                    + ['WebFetch', 'WebSearch'] + harness_claude_context_ask,
             'deny': (harness_dokos_denied_tools | map('regex_replace', '^', _dokos) | list)
                     + (harness_mail_denied_tools | map('regex_replace', '^', _mail) | list)
                     + (harness_calendar_denied_tools | map('regex_replace', '^', _cal) | list)
                     + harness_claude_protect_rules},
           'enabledMcpjsonServers': _harness_mcp_names,
           'hooks': {
             'PreToolUse': [{'matcher': '*', 'hooks': [_guard_hook]}],
             'PostToolUse': [{'matcher': _mail ~ '.*', 'hooks': [_guard_hook]}]},
           'sandbox': {
             'enabled': true,
             'allowUnsandboxedCommands': false,
             'failIfUnavailable': harness_claude_sandbox_required | bool,
             'filesystem': {
               'denyRead': [harness_config_root],
               'denyWrite': [harness_config_root] + harness_claude_sandbox_deny_write
                            + (harness_skills | map('regex_replace', '^', './.agents/skills/') | list)},
             'network': {'allowedDomains': [_harness_dokos_host] if _harness_dokos_user | bool else []}}}) }}
    _harness_claude_guard_policy:
      mail_prefix: "{{ _mail }}"
      mail_server: "{{ harness_mail_server }}"
      atelier_agent: atelier
      main_session_agents: [bureau, atelier]
      safe_tools: >-
        {{ harness_claude_safe_tools
           + (harness_dokos_read_tools | map('regex_replace', '^', _dokos) | list)
           + (harness_mail_read_tools | map('regex_replace', '^', _mail) | list)
           + (harness_calendar_read_tools | map('regex_replace', '^', _cal) | list) }}
      confirm_in_bureau: "{{ harness_claude_bureau_confirm_tools }}"
      # Files the agent writes without asking, in the Bureau too (C-4): the inbox and perso/.
      free_write_dirs:
        - "{{ harness_dest }}/{{ harness_context_inbox }}"
        - "{{ harness_dest }}/perso"
