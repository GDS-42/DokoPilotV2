# Runs on the server (play 1 of harness.yml), for one person (tasks/person.yml). Reads with
# sudo, nothing is changed on the server:
#   - the Dokos credentials of the person's assistant, for the dirigeant only (decision D-29):
#     /etc/dokopilot/assistants/<assistant email>.json = {"user", "api_key", "api_secret"};
#   - the person's Forgejo credentials (forgejo role):
#     /etc/dokopilot/forgejo/<id>.json = {"user", "password", "token"};
#   - the address of Forgejo (forgejo role, tasks/url.yml) and, in tailscale mode, the
#     MagicDNS name of the server (address of Dokos).
# What does not exist for this person is skipped; play 2 explains it in French.

- name: Find the person of this workstation
  ansible.builtin.include_tasks: person.yml

- name: Look for the Dokos credentials of the dirigeant's assistant
  ansible.builtin.stat:
    path: "{{ harness_server_credentials_dir }}/{{ _harness_person.assistant_email }}.json"
  become: "{{ harness_server_become | bool }}"
  register: _harness_dokos_file_stat
  when:
    - _harness_dokos_user | bool
    - harness_assistant_credentials is not defined

- name: Read the Dokos credentials of the dirigeant's assistant
  ansible.builtin.slurp:
    src: "{{ harness_server_credentials_dir }}/{{ _harness_person.assistant_email }}.json"
  become: "{{ harness_server_become | bool }}"
  register: _harness_dokos_file
  no_log: true
  when:
    - _harness_dokos_user | bool
    - harness_assistant_credentials is not defined
    - _harness_dokos_file_stat.stat.exists

- name: Keep the Dokos credentials in memory for the workstation play
  ansible.builtin.set_fact:
    _harness_server_credentials: "{{ _harness_dokos_file.content | b64decode | from_json }}"
  no_log: true
  when: _harness_dokos_file.content is defined

- name: Look for the Forgejo credentials of the person
  ansible.builtin.stat:
    path: "{{ harness_server_forgejo_credentials_dir }}/{{ _harness_person.id }}.json"
  become: "{{ harness_server_become | bool }}"
  register: _harness_forgejo_file_stat
  when: harness_forgejo_credentials is not defined

- name: Read the Forgejo credentials of the person
  ansible.builtin.slurp:
    src: "{{ harness_server_forgejo_credentials_dir }}/{{ _harness_person.id }}.json"
  become: "{{ harness_server_become | bool }}"
  register: _harness_forgejo_file
  no_log: true
  when:
    - harness_forgejo_credentials is not defined
    - _harness_forgejo_file_stat.stat.exists

- name: Keep the Forgejo credentials in memory for the workstation play
  ansible.builtin.set_fact:
    _harness_server_forgejo: "{{ _harness_forgejo_file.content | b64decode | from_json }}"
  no_log: true
  when: _harness_forgejo_file.content is defined

- name: Work out the address of Forgejo (same computation as the forgejo role)
  ansible.builtin.include_role:
    name: forgejo
    tasks_from: url
    apply:
      become: "{{ harness_server_become | bool }}"
  when: dokopilot_forgejo_url is not defined

- name: Read the MagicDNS name of the server
  ansible.builtin.command:
    cmd: tailscale status --json
  become: "{{ harness_server_become | bool }}"
  register: _harness_tailscale_status
  changed_when: false
  check_mode: false
  when:
    - dp.network.mode == 'tailscale'
    - harness_tailscale_dns_name is not defined

- name: Keep the MagicDNS name for the workstation play
  ansible.builtin.set_fact:
    _harness_server_dns_name: "{{ (_harness_tailscale_status.stdout | from_json).Self.DNSName | default('') }}"
  when:
    - dp.network.mode == 'tailscale'
    - harness_tailscale_dns_name is not defined
