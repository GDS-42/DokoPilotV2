# tailscale mode: `tailscale serve` publishes Dokos on the MagicDNS name, HTTPS by default.
# Caddy is not used and stays stopped.

- name: List the services
  ansible.builtin.service_facts:

- name: Stop Caddy, which only serves the lan mode
  ansible.builtin.systemd_service:
    name: caddy
    state: stopped
    enabled: false
  when: "'caddy.service' in ansible_facts['services']"

- name: Read the Tailscale state
  ansible.builtin.command: tailscale status --json
  register: _proxy_ts_status
  changed_when: false
  check_mode: false

- name: Check that the server is connected to Tailscale
  vars:
    _ts: "{{ _proxy_ts_status.stdout | from_json }}"
  ansible.builtin.assert:
    quiet: true
    that:
      - _ts.BackendState == 'Running'
      - _ts.Self.DNSName | default('') | length > 0
    fail_msg: >-
      Tailscale n'est pas connecté sur le serveur (état : {{ _ts.BackendState }}) : lancez
      d'abord l'installation système (system.yml), qui connecte le serveur au réseau Tailscale.

- name: Read the current publication
  ansible.builtin.command: tailscale serve status --json
  register: _proxy_serve_status
  changed_when: false
  check_mode: false

# The port of Forgejo (second publication, below) is left out of this comparison.
- name: Compare the publication with the expected one
  vars:
    _port: "{{ '443' if dp.network.tailscale.https else '80' }}"
    _kind: "{{ 'HTTPS' if dp.network.tailscale.https else 'HTTP' }}"
    _forgejo_port: "{{ proxy_forgejo_tailscale_port | string }}"
    _cfg: "{{ _proxy_serve_status.stdout | from_json if _proxy_serve_status.stdout is match('\\s*\\{') else {} }}"
    _tcp: "{{ _cfg.TCP | default({}) | dict2items | rejectattr('key', 'eq', _forgejo_port) | items2dict }}"
    _web: "{{ _cfg.Web | default({}) | dict2items | rejectattr('key', 'search', ':' ~ _forgejo_port ~ '$') | map(attribute='value') | list }}"
  ansible.builtin.set_fact:
    _proxy_serve_port: "{{ _port }}"
    # Funnel would publish Dokos on the Internet: a publication that has it is replaced.
    _proxy_serve_ok: >-
      {{ (_cfg.AllowFunnel | default({}, true) | dict2items | selectattr('value') | list | length == 0)
         and (_tcp | list) == [_port]
         and (_tcp[_port][_kind] | default(false)) | bool
         and _web | length == 1
         and (_web[0].Handlers | default({}) | list) == ['/']
         and _web[0].Handlers['/'].Proxy | default('') == 'http://' ~ proxy_backend }}

- name: Publish Dokos with tailscale serve
  when: not _proxy_serve_ok | bool
  block:
    - name: Remove the previous publication
      ansible.builtin.command: tailscale serve reset
      changed_when: true

    - name: Publish Dokos on the Tailscale network
      ansible.builtin.command:
        argv:
          - tailscale
          - serve
          - --bg
          - --yes
          - "{{ ('--https=' if dp.network.tailscale.https else '--http=') ~ _proxy_serve_port }}"
          - "http://{{ proxy_backend }}"
      changed_when: true
      timeout: "{{ proxy_tailscale_serve_timeout }}"

  rescue:
    - name: Report the refused publication
      ansible.builtin.fail:
        msg: >-
          tailscale serve n'a pas pu publier Dokos. Dans la console Tailscale (DNS), activez
          MagicDNS et les certificats HTTPS, autorisez Serve pour ce serveur si la console le
          demande, puis relancez l'installation. Détail : {{ ansible_failed_result.stderr | default(ansible_failed_result.msg | default('')) }}

- name: Keep the address of Dokos for the summary
  vars:
    _dnsname: "{{ (_proxy_ts_status.stdout | from_json).Self.DNSName | regex_replace('\\.$', '') }}"
  ansible.builtin.set_fact:
    dokopilot_dokos_url: "{{ ('https://' if dp.network.tailscale.https else 'http://') ~ _dnsname }}"

# --- Forgejo (context repositories): second publication, on its own port. Runs after the
# Dokos part, whose reset also removes it.
- name: Read the publication of Forgejo
  ansible.builtin.command: tailscale serve status --json
  register: _proxy_forgejo_serve_status
  changed_when: false
  check_mode: false

- name: Compare the publication of Forgejo with the expected one
  vars:
    _port: "{{ proxy_forgejo_tailscale_port | string }}"
    _kind: "{{ 'HTTPS' if dp.network.tailscale.https else 'HTTP' }}"
    _cfg: "{{ _proxy_forgejo_serve_status.stdout | from_json if _proxy_forgejo_serve_status.stdout is match('\\s*\\{') else {} }}"
    _web: "{{ _cfg.Web | default({}) | dict2items | selectattr('key', 'search', ':' ~ _port ~ '$') | map(attribute='value') | list }}"
  ansible.builtin.set_fact:
    _proxy_forgejo_published: "{{ _port in (_cfg.TCP | default({})) }}"
    _proxy_forgejo_serve_ok: >-
      {{ (_cfg.TCP[_port][_kind] | default(false)) | bool
         and _web | length == 1
         and (_web[0].Handlers | default({}) | list) == ['/']
         and _web[0].Handlers['/'].Proxy | default('') == 'http://' ~ proxy_forgejo_backend }}

- name: Publish Forgejo with tailscale serve
  when:
    - dp.context.enabled | bool
    - not _proxy_forgejo_serve_ok | bool
  block:
    - name: Publish Forgejo on the Tailscale network
      ansible.builtin.command:
        argv:
          - tailscale
          - serve
          - --bg
          - --yes
          - "{{ ('--https=' if dp.network.tailscale.https else '--http=') ~ proxy_forgejo_tailscale_port }}"
          - "http://{{ proxy_forgejo_backend }}"
      changed_when: true
      timeout: "{{ proxy_tailscale_serve_timeout }}"

  rescue:
    - name: Report the refused publication of Forgejo
      ansible.builtin.fail:
        msg: >-
          tailscale serve n'a pas pu publier Forgejo sur le port {{ proxy_forgejo_tailscale_port }}.
          Vérifiez dans la console Tailscale que les certificats HTTPS et Serve sont autorisés
          pour ce serveur, puis relancez l'installation. Détail : {{ ansible_failed_result.stderr | default(ansible_failed_result.msg | default('')) }}

- name: Withdraw the publication of Forgejo (context disabled)
  ansible.builtin.command:
    argv:
      - tailscale
      - serve
      - "{{ ('--https=' if dp.network.tailscale.https else '--http=') ~ proxy_forgejo_tailscale_port }}"
      - "off"
  changed_when: true
  when:
    - not dp.context.enabled | bool
    - _proxy_forgejo_published | bool

- name: Keep the address of Forgejo (context repositories)
  ansible.builtin.include_role:
    name: forgejo
    tasks_from: url
  when:
    - dp.context.enabled | bool
    - dokopilot_forgejo_url is not defined
