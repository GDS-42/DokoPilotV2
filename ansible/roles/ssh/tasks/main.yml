# OpenSSH hardening with a lockout guard: the new settings are applied only when every
# maintenance account can log in with a key. On a local server (server.local), the play
# runs without SSH: the guard still checks every maintenance account, that one included, so
# that remote maintenance keeps working, and nothing here touches the local session.

- name: Find the account used for this connection
  ansible.builtin.command: id -un
  become: false
  changed_when: false
  check_mode: false
  register: _ssh_login

- name: Look up the accounts
  ansible.builtin.getent:
    database: passwd

- name: Look up the members of the SSH group
  ansible.builtin.getent:
    database: group
    key: "{{ ssh_allow_group }}"
    fail_key: false

- name: Find the SSH keys of the maintenance accounts
  ansible.builtin.stat:
    path: "{{ (ansible_facts['getent_passwd'][item.name] | default([''] * 6))[4] | default('/nonexistent', true) }}/.ssh/authorized_keys"
  loop: "{{ dp.maintenance.users }}"
  loop_control:
    label: "{{ item.name }}"
  register: _ssh_keys

- name: Refuse settings that would lock every maintainer out
  vars:
    _ssh_members: "{{ ((ansible_facts['getent_group'][ssh_allow_group] | default(['', '', '']))[2] | default('', true)).split(',') }}"
  ansible.builtin.assert:
    quiet: true
    that:
      - item.item.name in ansible_facts['getent_passwd']
      - item.item.name in _ssh_members
      - item.stat.exists
      - item.stat.size > 0
    fail_msg: >-
      Durcissement SSH interrompu, rien n'a été modifié : le compte de maintenance
      « {{ item.item.name }} » n'existe pas, n'est pas dans le groupe {{ ssh_allow_group }}
      ou n'a pas de clé SSH sur le serveur. Après ce durcissement, seuls ces comptes peuvent
      se connecter : lancez d'abord le rôle maintenance (bootstrap.yml ou system.yml).
  loop: "{{ _ssh_keys.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Warn that the next runs must use a maintenance account
  ansible.builtin.debug:
    msg: >-
      Attention : vous êtes connecté avec « {{ _ssh_login.stdout }} », qui n'est pas un compte
      de maintenance. Après ce passage, seuls {{ dp.maintenance.users | map(attribute='name') | join(', ') }}
      pourront ouvrir une session SSH (clé uniquement, port {{ dp.server.ssh_port }}) : utilisez
      l'un d'eux pour les prochains passages.
  when: _ssh_login.stdout not in dp.maintenance.users | map(attribute='name') | list

# A machine installed without the SSH server ("everything on this machine", installed from
# its console) gets it here, so that remote maintenance stays possible, with a key only. The
# settings are written first, so that the new server starts hardened (Debian's sshd_config
# reads sshd_config.d/*.conf); sshd -t cannot check them before the package is there, and
# the tasks below check them as soon as it is.
- name: Check whether the OpenSSH server is installed
  ansible.builtin.stat:
    path: /usr/sbin/sshd
  register: _ssh_server

- name: Create the folder of the SSH server settings before installing it
  ansible.builtin.file:
    path: "{{ ssh_dropin_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not _ssh_server.stat.exists

- name: Write the SSH settings before installing the SSH server
  ansible.builtin.template:
    src: sshd_dokopilot.conf.j2
    dest: "{{ ssh_dropin_file }}"
    owner: root
    group: root
    mode: "0644"
  when: not _ssh_server.stat.exists

- name: Install the OpenSSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Apply the SSH settings
  block:
    - name: Write the SSH settings
      ansible.builtin.template:
        src: sshd_dokopilot.conf.j2
        dest: "{{ ssh_dropin_file }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
        validate: /usr/sbin/sshd -t -f %s
      register: _ssh_dropin
      notify: Reload ssh

    - name: Check the whole SSH server configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      check_mode: false

    # The first value of a keyword wins: a hosting provider's file read before ours, or a
    # Match block, would silently override the hardening. The settings are read as sshd
    # applies them to each maintenance account (-C evaluates the Match blocks); on a
    # mismatch the rescue below puts the previous file back and the run stops.
    - name: Read the SSH settings as they apply to each maintenance account
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
          - -C
          - "user={{ item.name }},host=localhost,addr=127.0.0.1"
      loop: "{{ dp.maintenance.users }}"
      loop_control:
        label: "{{ item.name }}"
      register: _ssh_effective
      changed_when: false
      when: not ansible_check_mode

    - name: Check that the hardened settings are the ones that apply
      vars:
        _ssh_settings: "{{ dict(item.stdout_lines | map('split', ' ', 1) | selectattr('1', 'defined') | map('list') | list) }}"
      ansible.builtin.assert:
        quiet: true
        that:
          - _ssh_settings.permitrootlogin | default('') == 'no'
          - _ssh_settings.passwordauthentication | default('') == 'no'
          - _ssh_settings.kbdinteractiveauthentication | default('') == 'no'
          - _ssh_settings.allowgroups | default('') == ssh_allow_group
        fail_msg: >-
          Les réglages SSH de DokoPilot ne sont pas ceux qui s'appliquent au compte
          « {{ item.item.name }} » (permitrootlogin {{ _ssh_settings.permitrootlogin | default('?') }},
          passwordauthentication {{ _ssh_settings.passwordauthentication | default('?') }},
          kbdinteractiveauthentication {{ _ssh_settings.kbdinteractiveauthentication | default('?') }},
          allowgroups {{ _ssh_settings.allowgroups | default('?') }}) : un autre fichier de
          /etc/ssh/sshd_config.d/ lu avant {{ ssh_dropin_file | basename }}, ou un bloc Match de
          sshd_config, prend le pas sur le durcissement.
      loop: "{{ _ssh_effective.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: not ansible_check_mode

    - name: Remove the backup of the previous SSH settings
      ansible.builtin.file:
        path: "{{ _ssh_dropin.backup_file }}"
        state: absent
      when: _ssh_dropin.backup_file is defined

  rescue:
    - name: Restore the previous SSH settings
      ansible.builtin.copy:
        src: "{{ _ssh_dropin.backup_file }}"
        dest: "{{ ssh_dropin_file }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: _ssh_dropin.backup_file is defined

    - name: Remove the rejected SSH settings
      ansible.builtin.file:
        path: "{{ ssh_dropin_file }}"
        state: absent
      when:
        - _ssh_dropin is changed
        - _ssh_dropin.backup_file is not defined

    - name: Report the invalid SSH configuration
      ansible.builtin.fail:
        msg: >-
          La configuration du serveur SSH est invalide (sshd -t a échoué) ou un autre réglage
          du serveur prend le pas sur le durcissement (voir le message ci-dessus) : les réglages
          précédents ont été conservés et le service n'a pas été rechargé. Vérifiez
          /etc/ssh/sshd_config et les fichiers de /etc/ssh/sshd_config.d/ sur le serveur
          (retirez ou corrigez celui qui autorise root ou les mots de passe), puis relancez.

- name: Keep the SSH server enabled and running
  ansible.builtin.systemd_service:
    name: ssh
    enabled: true
    state: started
