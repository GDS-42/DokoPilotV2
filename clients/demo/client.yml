# Client de démonstration, pour une VM locale avec des données de test.
# Vos réglages propres (adresse de la VM, compte de maintenance) vont dans
# clients/demo/client.local.yml, créé par `bin/dokopilot init demo` et ignoré par Git.
profile: demo

client:
  id: demo
  company_name: "Atelier Démo"
  company_abbr: "AD"

server:
  address: 192.168.122.10
  hostname: dokopilot-demo

maintenance:
  users:
    - name: integrateur
      full_name: "Intégrateur"
      ssh_public_key_files:
        - ~/.ssh/id_ed25519.pub
  sudo_requires_password: true

network:
  mode: lan

dokos:
  site_name: erp.demo.local
  admin_email: admin@demo.local

# Camille dirige l'atelier, Lucas y travaille ; chacun a son assistant
# (assistant.camille@atelier-demo.test et assistant.lucas@atelier-demo.test).
users:
  people:
    - id: camille
      email: camille.martin@atelier-demo.test
      first_name: Camille
      last_name: Martin
      role: dirigeant
      assistant: true
    - id: lucas
      email: lucas.bernard@atelier-demo.test
      first_name: Lucas
      last_name: Bernard
      role: membre
      assistant: true

etransactions:
  enabled: true
  environment: sandbox

backup:
  repository: /var/backups/dokopilot/restic

demo:
  load_test_data: true
