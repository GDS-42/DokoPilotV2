# DokoPilot — secrets d'un client (modèle)
#
# `bin/dokopilot init <client>` crée clients/<client>/secrets.yml.age à partir de ce
# modèle, remplit les mots de passe au hasard et chiffre le fichier avec age pour les
# destinataires de clients/<client>/recipients.txt (votre clé, celle de l'entrepreneur,
# une clé de secours). Ne mettez jamais ce fichier en clair dans Git. Pour le modifier :
#   bin/dokopilot secrets <client> edit
#
# Valeur « generate » : un mot de passe aléatoire est créé à l'initialisation.
# Valeur vide : secret facultatif, non utilisé tant qu'il est vide.

secrets:
  maintenance_sudo_password: generate   # mot de passe sudo des comptes de maintenance
  db_root_password: generate            # MariaDB, utilisateur root (jamais exposé hors du serveur)
  dokos_admin_password: generate        # compte Administrator de Dokos
  forgejo_admin_password: generate      # compte dokopilot-admin de Forgejo (dépôts de contexte)
  entrepreneur_password: generate       # mot de passe initial de l'entrepreneur (à changer)
  restic_password: generate             # chiffrement des sauvegardes : à conserver hors du serveur !
  restic_env: {}                        # ex. { AWS_ACCESS_KEY_ID: "...", AWS_SECRET_ACCESS_KEY: "..." }
  tailscale_auth_key: ""                # clé d'authentification Tailscale (usage unique conseillé)
  etransactions: {}                     # identifiants Super PDP fournis à l'entrepreneur
  ai_providers: {}                      # ex. { mistral: "..." } pour les pipelines Dokos AI
# Les mots de passe de messagerie et d'agenda de l'entrepreneur ne vont PAS ici :
# ils restent sur son poste (voir docs/poste-entrepreneur.md).
