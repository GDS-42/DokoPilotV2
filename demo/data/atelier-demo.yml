#
# Données de test de l'« Atelier Démo », petite menuiserie-ébénisterie FICTIVE.
#
# Tout est inventé : raisons sociales (toutes contiennent « Démo »), adresses, SIREN,
# numéros de TVA, IBAN (banque « 99999 », qui n'existe pas), courriels (domaine
# réservé .test). Les SIREN commencent par 0000, ce qui n'est attribué à aucune
# entreprise ; ils respectent seulement la clé de Luhn exigée par Dokos.
#
# Les dates sont des décalages en jours par rapport au jour du chargement
# (« jour: -30 » = il y a 30 jours), pour que la démo reste vraisemblable.
# Chargées par demo/demo_loader.py (rôle Ansible demo_data, profil demo uniquement).
# Description et scénarios : docs/donnees-de-test.md.

societe:
  siren: "000000018"
  tva: FR66000000018
  adresse:
    ligne1: 12 rue des Copeaux
    code_postal: "39000"
    ville: Lons-le-Saunier
  courriel: contact@atelier-demo.test
  telephone: "+33 3 00 00 00 00"

banque:
  nom: Banque Démo
  compte: Compte courant Banque Démo
  iban: FR7699999000010000000010106
  bic: DEMOFRPPXXX
  compte_comptable: "5121"          # numéro du compte du plan comptable (512 Banques)
  releve: bank/releve-demo.csv
  # Date à laquelle correspondent les dates du fichier CSV ; le chargeur décale toutes
  # les lignes pour que cette date devienne le jour du chargement.
  date_de_reference: "2026-11-01"

articles:
  # Matières premières et fournitures (achetées, stockées)
  - code: PLANCHE-CHENE
    nom: Planche de chêne massif 27 mm
    groupe: Raw Material
    unite: Unit
    stock: true
    achat: 45.00
  - code: PANNEAU-CP18
    nom: Panneau contreplaqué bouleau 18 mm
    groupe: Raw Material
    unite: Unit
    stock: true
    achat: 38.50
  - code: CHARNIERE-INV
    nom: Charnières invisibles (lot de 10)
    groupe: Consumable
    unite: Unit
    stock: true
    achat: 24.00
  - code: VIS-INOX
    nom: Vis inox 4x40 (boîte de 500)
    groupe: Consumable
    unite: Unit
    stock: true
    achat: 18.90
  - code: VERNIS-EAU
    nom: Vernis à l'eau incolore 5 L
    groupe: Consumable
    unite: Unit
    stock: true
    achat: 62.00
  - code: COLLE-BOIS
    nom: Colle vinylique 1 kg
    groupe: Consumable
    unite: Unit
    stock: true
    achat: 9.80
  # Produits finis (vendus)
  - code: TABLE-CHENE
    nom: Table de salle à manger en chêne
    groupe: Products
    unite: Unit
    stock: true
    vente: 1450.00
  - code: CHAISE-CHENE
    nom: Chaise en chêne
    groupe: Products
    unite: Unit
    stock: true
    vente: 280.00
  - code: BIBLIO-MESURE
    nom: Bibliothèque sur mesure
    groupe: Products
    unite: Unit
    stock: true
    vente: 2400.00
  # Prestations (non stockées)
  - code: POSE
    nom: Pose et installation (heure)
    groupe: Services
    unite: Hour
    stock: false
    vente: 55.00
  - code: LIVRAISON
    nom: Livraison
    groupe: Services
    unite: Unit
    stock: false
    vente: 90.00
  - code: ETUDE-PLAN
    nom: Étude et plan sur mesure
    groupe: Services
    unite: Unit
    stock: false
    vente: 350.00

