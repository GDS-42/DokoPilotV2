# Commandes d'achat (validées), avec leurs réceptions (validées) éventuelles.
commandes_achat:
  - cle: CA-1
    fournisseur: Scierie Démo du Jura
    jour: -70
    lignes: [{ article: PLANCHE-CHENE, quantite: 20, prix: 45.00 }]
    reception: { jour: -62 }
  - cle: CA-2
    fournisseur: Panneaux Démo Bois
    jour: -45
    lignes: [{ article: PANNEAU-CP18, quantite: 15, prix: 38.50 }]
    reception: { jour: -40 }
  - cle: CA-3
    fournisseur: Quincaillerie Démo Pro
    jour: -30
    lignes:
      - { article: CHARNIERE-INV, quantite: 10, prix: 24.00 }
      - { article: VIS-INOX, quantite: 4, prix: 18.90 }
    # Réception partielle : les vis ne sont pas encore arrivées.
    reception: { jour: -25, lignes: [{ article: CHARNIERE-INV, quantite: 10 }] }
  - cle: CA-4
    fournisseur: Peintures et Vernis Démo
    jour: -20
    lignes:
      - { article: VERNIS-EAU, quantite: 6, prix: 62.00 }
      - { article: COLLE-BOIS, quantite: 10, prix: 9.80 }

# Facture d'achat déjà traitée (validée et payée) avant l'arrivée de la facturation électronique.
factures_achat:
  - cle: FA-1
    fournisseur: Peintures et Vernis Démo
    numero_fournisseur: PV-0412
    jour: -85
    lignes: [{ article: VERNIS-EAU, quantite: 4, prix: 62.00 }]
    paiement: { jour: -59, reference: VIR-PV-0412 }

# Factures de vente (validées), échéance à 30 jours.
factures_vente:
  - cle: FV-1
    client: Restaurant Démo Le Chêne Vert
    jour: -80
    lignes:
      - { article: TABLE-CHENE, quantite: 2 }
      - { article: POSE, quantite: 4 }
    paiement: { jour: -45, reference: VIR-CHENEVERT-1 }
  - cle: FV-2
    client: Hôtel Démo des Tilleuls
    jour: -72
    lignes:
      - { article: BIBLIO-MESURE, quantite: 1 }
      - { article: ETUDE-PLAN, quantite: 1 }
    # Impayée et échue : à relancer.
  - cle: FV-3
    client: Agence Démo Architecture Intérieure
    jour: -60
    lignes: [{ article: CHAISE-CHENE, quantite: 6 }]
    paiement: { jour: -30, reference: VIR-ARCHI-1 }
  - cle: FV-4
    client: Mairie de Démoville
    jour: -50
    lignes:
      - { article: BIBLIO-MESURE, quantite: 2 }
      - { article: POSE, quantite: 8 }
    # Impayée et échue : à relancer.
  - cle: FV-5
    client: Cabinet Démo Dentaire
    jour: -40
    lignes:
      - { article: TABLE-CHENE, quantite: 1 }
      - { article: LIVRAISON, quantite: 1 }
    # Acompte seulement : le reste est échu.
    paiement: { jour: -12, montant: 800.00, reference: VIR-DENTAIRE-ACOMPTE }
  - cle: FV-6
    client: Jean Démo
    jour: -25
    lignes:
      - { article: CHAISE-CHENE, quantite: 2 }
      - { article: LIVRAISON, quantite: 1 }
  - cle: FV-7
    client: Restaurant Démo Le Chêne Vert
    jour: -15
    lignes: [{ article: CHAISE-CHENE, quantite: 8 }]
    # Payée selon le relevé bancaire, mais le paiement n'est pas encore saisi.
  - cle: FV-8
    client: Hôtel Démo des Tilleuls
    jour: -8
    lignes: [{ article: POSE, quantite: 6 }]

# Factures électroniques reçues (générées par demo/einvoices/generate.py), importées par
# le chemin de réception d'eTransactions : elles deviennent des « factures fournisseurs »
# à traiter.
factures_recues:
  - cle: FR-1
    fournisseur: Scierie Démo du Jura
    numero: SDJ-2026-0187
    jour: -60
    commande: CA-1                 # conforme à la commande et à la réception
    syntaxe: CII
    lignes: [{ article: PLANCHE-CHENE, ref_fournisseur: CH27-MASSIF, quantite: 20, prix: 45.00 }]
  - cle: FR-2
    fournisseur: Panneaux Démo Bois
    numero: PDB-11872
    jour: -38
    commande: CA-2
    syntaxe: CII
    # Écart de prix : 42,00 € facturés contre 38,50 € commandés.
    lignes: [{ article: PANNEAU-CP18, ref_fournisseur: CP-BOU-18, quantite: 15, prix: 42.00 }]
  - cle: FR-3
    fournisseur: Quincaillerie Démo Pro
    numero: QDP-F-30512
    jour: -24
    commande: CA-3                 # facture toute la commande, vis non reçues
    syntaxe: CII
    lignes:
      - { article: CHARNIERE-INV, ref_fournisseur: CHI-35-L10, quantite: 10, prix: 24.00 }
      - { article: VIS-INOX, ref_fournisseur: VX440-B500, quantite: 4, prix: 18.90 }
  - cle: FR-4
    fournisseur: Transports Démo Express
    numero: TDE-2026-0944
    jour: -5
    syntaxe: CII
    # Prestation sans commande.
    lignes: [{ ref_fournisseur: TRANSP-REG, designation: Transport de bois Champagnole - Lons, quantite: 1, prix: 185.00 }]
  - cle: FR-5
    fournisseur: Maintenance Machines Démo
    numero: MMD-7731
    jour: -3
    syntaxe: UBL
    # Prestation sans commande, au format UBL.
    lignes: [{ ref_fournisseur: ENT-RABOT, designation: Entretien annuel de la raboteuse, quantite: 1, prix: 320.00 }]
