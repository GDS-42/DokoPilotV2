# Layered on clients/demo/client.yml by run.sh: the dirigeant (Camille), both harnesses, mail
# and calendar on, Mistral models (small left empty: the config role sets it to the Bureau
# model), Claude Code with a subscription. The public key is a throwaway test key, not a
# secret; the hosts do not exist.
maintenance:
  users:
    - name: integrateur
      ssh_public_keys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICdlz24XChizBwhFPp6gSD44SkpfKjNkaDkSJAQyvIlB test@example"]
  sudo_requires_password: true

models:
  provider: mistral
  bureau: mistral/mistral-medium-latest
  atelier: mistral/devstral-medium-latest
  claude_code_auth: subscription

harness:
  default: opencode
  enabled: [opencode, claude-code]
  mail:
    enabled: true
    imap_host: imap.example.test
    smtp_host: smtp.example.test
    username: camille.martin@atelier-demo.test
  calendar:
    enabled: true
    caldav_url: https://dav.example.test/remote.php/dav
    username: camille.martin
