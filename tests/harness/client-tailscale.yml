# Layered on clients/demo/client.yml by run.sh: the dirigeant in tailscale mode, opencode
# only, OpenCode 1 shapes (static rules, small_model, provider options), Anthropic models,
# no mail and no calendar. The public key is a throwaway test key.
maintenance:
  users:
    - name: integrateur
      ssh_public_keys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICdlz24XChizBwhFPp6gSD44SkpfKjNkaDkSJAQyvIlB test@example"]
  sudo_requires_password: true

network:
  mode: tailscale

models:
  provider: anthropic
  bureau: anthropic/claude-sonnet-4-5
  atelier: anthropic/claude-opus-4-1
  small: anthropic/claude-haiku-4-5

harness:
  default: opencode
  enabled: [opencode]
  opencode_version: 1
